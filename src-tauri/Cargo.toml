[package]
name = "clavis"
version = "0.4.3"
description = "Clipboard history, snippets and encrypted notes"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "clavis_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
bip39 = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg"] }
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
thiserror = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
yrs = "0.28"
tungstenite = { version = "0.30", features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5", features = ["monitor", "std"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_TextServices",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_Security_Cryptography",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_System_Registry",
  "Win32_System_Time",
  "Foundation",
  "Foundation_Collections",
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
  "Globalization",
  "Security_Credentials",
  "Security_Cryptography",
  "UI_Notifications",
  "Data_Xml_Dom",
] }
webview2-com = "0.39"
windows-core-62 = { package = "windows-core", version = "0.62" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
